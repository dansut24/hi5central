services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hi5central
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hi5central
    volumes:
      - hi5central_postgres:/var/lib/postgresql/data
    networks:
      - hi5central

  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - hi5central_redis:/data
    networks:
      - hi5central

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    networks:
      - hi5central

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: https://api.hi5central.com
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - hi5central

  marketing:
    build:
      context: /root/apps/hi5tech-website
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - hi5central

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - hi5central_caddy_data:/data
      - hi5central_caddy_config:/config
    depends_on:
      - api
      - web
      - marketing
    networks:
      - hi5central

volumes:
  hi5central_postgres:
  hi5central_redis:
  hi5central_caddy_data:
  hi5central_caddy_config:

networks:
  hi5central:
